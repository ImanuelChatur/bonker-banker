{% extends "base.html" %}
{% block title %}Plan · Bonker Banker{% endblock %}

{% block content %}
<div class="card">
  <h1 class="text-2xl font-bold mb-4">Plan</h1>
  <form hx-post="/plan/run" hx-target="#result" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <label class="block"><span class="metric-label">Account ID</span>
        <input name="account_id" required value="{{ account_id }}" class="border rounded px-2 py-1 w-full" style="border-color:var(--border)"></label>
      <label class="block"><span class="metric-label">Emergency fund goal (months of spending)</span>
        <input name="goal_months" type="number" step="any" value="3" class="border rounded px-2 py-1 w-full" style="border-color:var(--border)"></label>
      <label class="block"><span class="metric-label">Backup plan: survive this many months</span>
        <input name="target_runway" type="number" step="any" value="6" class="border rounded px-2 py-1 w-full" style="border-color:var(--border)"></label>
    </div>
    <p class="text-muted">Shock to plan for (default: job loss with EI at 55%):</p>
    {% set f = {"income_pct": 55, "duration_months": 6} %}
    {% include "partials/shock_fields.html" %}
    <button class="btn-primary" type="submit">Make plan</button>
  </form>
</div>
<div id="result" class="mt-6"></div>
{% endblock %}
