{% extends "base.html" %}

{% block content %}
<div class="card">
  <h1 class="text-3xl font-bold mb-1">Bonker Banker</h1>
  <p class="text-muted mb-6">Know your runway before life goes bonkers.</p>

  <!-- HTMX test: clicking calls /health and swaps the reply into #status -->
  <button hx-get="/health" hx-target="#status" class="btn-primary">
    Test connection
  </button>
  <span id="status" class="ml-3 text-muted">Not tested yet</span>
</div>

<div class="card">
  <h2 class="card-title">Runway test chart (fake data)</h2>
  <!-- charts.js draws this automatically from the data-chart attribute -->
  <div class="chart" data-chart='{
    "labels": ["Now", "M1", "M2", "M3", "M4", "M5", "M6"],
    "yName": "Buffer ($)",
    "series": [{ "name": "Buffer", "data": [8000, 6900, 5800, 4700, 3600, 2500, 1400] }]
  }'></div>
</div>
{% endblock %}
