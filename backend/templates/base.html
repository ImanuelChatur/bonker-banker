<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bonker Banker{% endblock %}</title>

  <!-- Libraries from CDNs, no build step -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <!-- Our own styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="min-h-screen">
  <nav class="nav">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="nav-brand">Bonker Banker</a>
      <div class="flex gap-6">
        <a href="/customer" class="nav-link">Customer</a>
        <a href="/shock" class="nav-link">Shock Lab</a>
        <a href="/plan" class="nav-link">Plan</a>
        <a href="/insights" class="nav-link">Insights</a>
        <a href="/upload" class="nav-link">Upload</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Our own scripts -->
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
